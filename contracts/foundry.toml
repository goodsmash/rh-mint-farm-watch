[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = ["erc721a/=lib/ERC721A/", "solady/=lib/solady/src/", "forge-std/=lib/forge-std/src/"]
gas_limit = "18446744073709551615"
fs_permissions = [{ access = "read-write", path = "./previews" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
